<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>던전 크롤러 — Roguelike</title>
<style>
  :root {
    --bg: #0d0e14;
    --panel: #16181f;
    --border: #2a2d3a;
    --text: #cdd3de;
    --accent: #ffcf5c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, monospace;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
    min-height: 100%;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 2px;
    margin: 4px 0;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(255, 207, 92, 0.3);
  }
  #stats {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 14px;
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #stats b { color: var(--accent); }
  .hp { color: #ff6b6b; }
  .gold { color: #ffcf5c; }
  .lvl { color: #6bd3ff; }
  #game {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #000;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    image-rendering: pixelated;
    max-width: 100%;
  }
  #log {
    width: 640px;
    max-width: 100%;
    height: 110px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  #log div { opacity: 0.85; }
  #log div:last-child { opacity: 1; color: #fff; }
  .hint {
    font-size: 12px;
    opacity: 0.55;
    text-align: center;
    max-width: 640px;
  }
  .msg-hit { color: #ff8f6b; }
  .msg-good { color: #7be08a; }
  .msg-bad { color: #ff6b6b; }
  .msg-info { color: #6bd3ff; }

  /* ---- 계정 ---- */
  #account {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  #account-status { opacity: 0.8; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1406; font-weight: bold; }
  button.primary:hover:not(:disabled) { color: #1a1406; filter: brightness(1.08); }

  #login-modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.7);
  }
  #login-modal[hidden] { display: none; }
  .modal {
    width: 360px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
  }
  .modal h2 { margin: 0 0 6px; font-size: 17px; color: var(--accent); }
  .modal .sub { margin: 0 0 14px; font-size: 12px; line-height: 1.5; opacity: 0.7; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  .modal form { display: flex; flex-direction: column; gap: 8px; }
  .modal form[hidden] { display: none; }
  .modal label { font-size: 12px; opacity: 0.7; }
  .modal input {
    font: inherit;
    font-size: 15px;
    color: #fff;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal .row { display: flex; gap: 8px; }
  .modal .row button { flex: 1; }
  #login-msg { min-height: 18px; margin: 10px 0 0; font-size: 12px; }
  #login-msg.err { color: #ff6b6b; }
  #login-msg.ok { color: #7be08a; }
  #login-close { width: 100%; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <h1>⚔ 던전 크롤러 ⚔</h1>
  <div id="account">
    <span id="account-status"></span>
    <button id="account-btn" type="button"></button>
  </div>
  <div id="stats">
    <span>층 <b id="depth">1</b> (최고 <span id="best">0</span>)</span>
    <span class="hp">HP <b id="hp">--</b></span>
    <span>공격 <b id="atk">--</b></span>
    <span class="gold">골드 <b id="gold">0</b></span>
    <span class="lvl">Lv <b id="plvl">1</b> (<span id="xp">0</span>/<span id="xpn">0</span>)</span>
  </div>
  <canvas id="game" width="640" height="480"></canvas>
  <div id="log"></div>
  <p class="hint">이동: 방향키 / WASD &nbsp;·&nbsp; 제자리 대기: Space &nbsp;·&nbsp; 포션: Q &nbsp;·&nbsp; 재시작: R<br>
  계단(&gt;)을 밟으면 다음 층으로 내려갑니다. 적에게 부딪히면 공격합니다.</p>
</div>

<div id="login-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <h2 id="login-title">계정 연결</h2>
    <p class="sub">받은 인증 코드를 입력하면 어느 기기에서든 진행 상황을 이어서 플레이할 수 있어요. 지금 게스트 진행 상황은 계정으로 옮겨져요.</p>
    <div class="tabs">
      <button type="button" data-kind="email" class="on">이메일</button>
      <button type="button" data-kind="phone">휴대폰</button>
    </div>
    <form id="step-id">
      <label for="login-id" id="login-id-label">이메일</label>
      <input id="login-id" type="email" autocomplete="email" required>
      <button class="primary" type="submit">인증 코드 받기</button>
    </form>
    <form id="step-code" hidden>
      <label for="login-code" id="login-code-label">인증 코드</label>
      <input id="login-code" inputmode="numeric" autocomplete="one-time-code" required>
      <div class="row">
        <button type="button" id="login-back">다시 입력</button>
        <button class="primary" type="submit">확인</button>
      </div>
    </form>
    <p id="login-msg"></p>
    <button id="login-close" type="button">닫기</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---- 설정 ----
  const TILE = 20;                 // 타일 픽셀 크기
  const MAP_W = 32, MAP_H = 24;    // 맵 크기(타일 단위)
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = MAP_W * TILE;
  canvas.height = MAP_H * TILE;

  // 타일 종류
  const WALL = 0, FLOOR = 1, STAIRS = 2;

  // ---- 유틸 ----
  const rnd = (n) => Math.floor(Math.random() * n);
  const between = (lo, hi) => lo + rnd(hi - lo + 1);
  const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);

  // ---- Xsolla Login 설정 ----
  // Publisher Account → Players → Login 에서 복사해 넣으세요. 공개 값이라 클라이언트에 있어도 됩니다.
  // 두 값이 비어 있으면 계정 기능은 꺼지고 게스트로만 플레이합니다.
  const XSOLLA = {
    loginProjectId: "",                                   // Login 프로젝트 UUID
    clientId: "",                                         // OAuth 2.0 public 클라이언트 ID (숫자)
    publisherProjectId: 317991,                           // 퍼블리셔 프로젝트 ID
    redirectUri: "https://hucksoon.github.io/hucksoon/",  // PA의 redirect URI와 정확히 같아야 함
  };
  const LOGIN_API = "https://login.xsolla.com/api";
  const SAVE_KEY = "rl_save";          // 로컬 저장 키
  const SAVE_ATTR = "roguelike_save";  // 계정 속성(attribute) 키

  // localStorage는 사생활 보호 모드 등에서 예외를 던질 수 있음
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const randomId = () => (crypto.randomUUID ? crypto.randomUUID()
    : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join(""));

  // ---- 계정 (Xsolla Login, OAuth 2.0 + 이메일/휴대폰 인증 코드) ----
  const Account = (() => {
    const AUTH_KEY = "rl_auth";
    let auth = null;   // { access, refresh, exp }
    let state = null;  // 인증 요청 1회분의 CSRF state
    try { auth = JSON.parse(store.get(AUTH_KEY)); } catch {}

    const configured = () => !!(XSOLLA.loginProjectId && XSOLLA.clientId);

    // 게스트 식별용 기기 ID: 처음 접속 때 만든 무작위 UUID
    function deviceId() {
      let id = store.get("rl_device_id");
      if (!id) { id = randomId(); store.set("rl_device_id", id); }
      return id;
    }

    async function call(path, { method = "POST", json, form, token, keepalive } = {}) {
      const headers = {};
      let body;
      if (json) { headers["Content-Type"] = "application/json"; body = JSON.stringify(json); }
      if (form) { headers["Content-Type"] = "application/x-www-form-urlencoded"; body = new URLSearchParams(form); }
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(LOGIN_API + path, { method, headers, body, keepalive });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch {}
      if (!res.ok) {
        const err = new Error(data?.error?.description || data?.error_description || `요청 실패 (${res.status})`);
        err.status = res.status;
        err.code = data?.error?.code;
        throw err;
      }
      return data;
    }

    function oauthQuery() {
      return new URLSearchParams({
        projectId: XSOLLA.loginProjectId,
        client_id: XSOLLA.clientId,
        response_type: "code",
        redirect_uri: XSOLLA.redirectUri,
        state,
        scope: "offline",  // refresh_token 발급
      });
    }
    const identity = (kind, value) =>
      kind === "email" ? { email: value.toLowerCase() } : { phone_number: value };

    // 1단계: 인증 코드 발송 → operation_id
    async function requestCode(kind, value) {
      state = randomId();
      const data = await call(`/oauth2/login/${kind}/request?${oauthQuery()}`, {
        json: { ...identity(kind, value), send_link: false },
      });
      return data.operation_id;
    }

    // 2단계: 코드 확인 → login_url의 code를 토큰으로 교환
    async function confirmCode(kind, value, code, operationId) {
      const data = await call(`/oauth2/login/${kind}/confirm?${oauthQuery()}`, {
        json: { ...identity(kind, value), code, operation_id: operationId },
      });
      const url = new URL(data.login_url);
      if (url.searchParams.get("state") !== state) throw new Error("인증 응답이 올바르지 않습니다. 다시 시도해 주세요.");
      await issueToken({
        grant_type: "authorization_code",
        client_id: XSOLLA.clientId,
        redirect_uri: XSOLLA.redirectUri,
        code: url.searchParams.get("code"),
      });
    }

    async function issueToken(form) {
      const data = await call("/oauth2/token", { form });
      auth = {
        access: data.access_token,
        refresh: data.refresh_token || auth?.refresh || null,
        exp: Date.now() + (data.expires_in || 3600) * 1000,
      };
      store.set(AUTH_KEY, JSON.stringify(auth));
    }

    // 만료 1분 전이면 갱신. 갱신이 거부되면(4xx) 로그아웃, 네트워크 오류면 유지
    async function token() {
      if (!auth) return null;
      if (Date.now() < auth.exp - 60000) return auth.access;
      if (!auth.refresh) { logout(); return null; }
      try {
        await issueToken({ grant_type: "refresh_token", client_id: XSOLLA.clientId, refresh_token: auth.refresh });
        return auth.access;
      } catch (e) {
        if (e.status >= 400 && e.status < 500) logout();
        return null;
      }
    }

    function claims() {
      if (!auth) return null;
      try {
        const b64 = auth.access.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
      } catch { return null; }
    }

    function logout() {
      auth = null;
      store.del(AUTH_KEY);
    }

    // 계정 속성(attribute)에 게임 저장: 클라이언트가 쓸 수 있는 private 속성
    async function loadAttr(key) {
      const t = await token();
      if (!t) return undefined;
      const list = await call("/attributes/users/me/get", {
        token: t,
        json: { keys: [key], publisher_project_id: XSOLLA.publisherProjectId },
      });
      const attr = Array.isArray(list) ? list.find(a => a.key === key) : null;
      return attr ? attr.value : null;
    }

    async function saveAttr(key, value, keepalive = false) {
      const t = await token();
      if (!t) return;
      await call("/attributes/users/me/update", {
        token: t,
        keepalive,
        json: {
          attributes: [{ key, permission: "private", value }],
          publisher_project_id: XSOLLA.publisherProjectId,
        },
      });
    }

    return {
      configured, deviceId, requestCode, confirmCode, logout, claims, loadAttr, saveAttr,
      loggedIn: () => !!auth,
    };
  })();

  // ---- 게임 상태 ----
  let map, visible, seen, player, enemies, items, depth, gameOver;
  let bestDepth = 0;

  const ENEMY_TYPES = [
    { ch: "r", name: "쥐",     color: "#a58b6f", hp: 3,  atk: 1, xp: 2 },
    { ch: "g", name: "고블린", color: "#7bce6b", hp: 6,  atk: 2, xp: 5 },
    { ch: "o", name: "오크",   color: "#5fae4e", hp: 10, atk: 3, xp: 9 },
    { ch: "T", name: "트롤",   color: "#9b7bce", hp: 16, atk: 5, xp: 16 },
  ];

  // ---- 던전 생성 (방 + 통로) ----
  function generateDungeon() {
    map = Array.from({ length: MAP_H }, () => new Array(MAP_W).fill(WALL));
    visible = Array.from({ length: MAP_H }, () => new Array(MAP_W).fill(false));
    seen = Array.from({ length: MAP_H }, () => new Array(MAP_W).fill(false));

    const rooms = [];
    const roomCount = between(6, 9);
    for (let i = 0; i < roomCount * 3 && rooms.length < roomCount; i++) {
      const w = between(4, 8), h = between(3, 6);
      const x = between(1, MAP_W - w - 2), y = between(1, MAP_H - h - 2);
      const newRoom = { x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) };
      if (rooms.some(r => overlaps(r, newRoom))) continue;
      carveRoom(newRoom);
      if (rooms.length > 0) {
        const prev = rooms[rooms.length - 1];
        carveCorridor(prev.cx, prev.cy, newRoom.cx, newRoom.cy);
      }
      rooms.push(newRoom);
    }
    return rooms;
  }

  function overlaps(a, b) {
    return a.x <= b.x + b.w + 1 && a.x + a.w + 1 >= b.x &&
           a.y <= b.y + b.h + 1 && a.y + a.h + 1 >= b.y;
  }
  function carveRoom(r) {
    for (let y = r.y; y < r.y + r.h; y++)
      for (let x = r.x; x < r.x + r.w; x++)
        map[y][x] = FLOOR;
  }
  function carveCorridor(x1, y1, x2, y2) {
    if (rnd(2)) { hLine(x1, x2, y1); vLine(y1, y2, x2); }
    else        { vLine(y1, y2, x1); hLine(x1, x2, y2); }
  }
  function hLine(x1, x2, y) {
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) map[y][x] = FLOOR;
  }
  function vLine(y1, y2, x) {
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) map[y][x] = FLOOR;
  }

  // ---- 스폰 ----
  function randomFloor(exclude) {
    for (let tries = 0; tries < 500; tries++) {
      const x = rnd(MAP_W), y = rnd(MAP_H);
      if (map[y][x] !== FLOOR) continue;
      if (exclude && exclude.some(p => p.x === x && p.y === y)) continue;
      return { x, y };
    }
    return null;
  }

  function newLevel(rooms) {
    const start = rooms[0];
    player.x = start.cx; player.y = start.cy;

    // 계단 배치 (가장 먼 방)
    let far = rooms[0], best = -1;
    for (const r of rooms) {
      const d = dist(r, start);
      if (d > best) { best = d; far = r; }
    }
    map[far.cy][far.cx] = STAIRS;

    // 적 스폰 (층이 깊을수록 강해짐)
    enemies = [];
    const count = between(4 + depth, 6 + depth * 2);
    const maxTier = Math.min(ENEMY_TYPES.length - 1, Math.floor(depth / 2));
    for (let i = 0; i < count; i++) {
      const spot = randomFloor([player]);
      if (!spot) break;
      const tier = between(0, maxTier);
      const t = ENEMY_TYPES[tier];
      enemies.push({ x: spot.x, y: spot.y, ...t, hp: t.hp, maxHp: t.hp });
    }

    // 아이템 스폰
    items = [];
    const potions = between(1, 3);
    for (let i = 0; i < potions; i++) {
      const spot = randomFloor([player, ...enemies, ...items]);
      if (spot) items.push({ x: spot.x, y: spot.y, type: "potion" });
    }
    // 가끔 골드 더미
    const golds = between(2, 4);
    for (let i = 0; i < golds; i++) {
      const spot = randomFloor([player, ...enemies, ...items]);
      if (spot) items.push({ x: spot.x, y: spot.y, type: "gold", amount: between(3, 12) });
    }

    computeFOV();
  }

  // ---- 시야(FOV): 간단한 반경 + 라인 오브 사이트 ----
  function computeFOV() {
    for (let y = 0; y < MAP_H; y++)
      for (let x = 0; x < MAP_W; x++) visible[y][x] = false;

    const R = 7;
    for (let a = 0; a < 360; a += 2) {
      const rad = a * Math.PI / 180;
      const dx = Math.cos(rad), dy = Math.sin(rad);
      let px = player.x + 0.5, py = player.y + 0.5;
      for (let step = 0; step < R; step++) {
        const tx = Math.floor(px), ty = Math.floor(py);
        if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) break;
        visible[ty][tx] = true;
        seen[ty][tx] = true;
        if (map[ty][tx] === WALL) break;
        px += dx; py += dy;
      }
    }
    visible[player.y][player.x] = true;
    seen[player.y][player.x] = true;
  }

  // ---- 로그 ----
  const logEl = document.getElementById("log");
  function log(msg, cls) {
    const d = document.createElement("div");
    if (cls) d.className = "msg-" + cls;
    d.textContent = msg;
    logEl.appendChild(d);
    while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ---- 플레이어 액션 ----
  function tryMove(dx, dy) {
    if (gameOver) return;
    const nx = player.x + dx, ny = player.y + dy;
    if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return;
    if (map[ny][nx] === WALL) return;

    const foe = enemies.find(e => e.x === nx && e.y === ny);
    if (foe) { attack(player, foe); }
    else {
      player.x = nx; player.y = ny;
      pickup();
      if (map[ny][nx] === STAIRS) { descend(); return; }
    }
    endTurn();
  }

  function wait() {
    if (gameOver) return;
    endTurn();
  }

  function attack(attacker, target) {
    const dmg = Math.max(1, attacker.atk + rnd(2));
    target.hp -= dmg;
    if (attacker === player) {
      log(`${target.name}에게 ${dmg} 피해!`, "hit");
      if (target.hp <= 0) killEnemy(target);
    } else {
      log(`${attacker.name}에게 ${dmg} 피해를 입음.`, "bad");
      if (target.hp <= 0) death();
    }
  }

  function killEnemy(e) {
    enemies = enemies.filter(x => x !== e);
    log(`${e.name} 처치! (+${e.xp} XP)`, "good");
    gainXp(e.xp);
  }

  function gainXp(amount) {
    player.xp += amount;
    while (player.xp >= player.xpNext) {
      player.xp -= player.xpNext;
      player.plvl++;
      player.xpNext = Math.floor(player.xpNext * 1.5);
      player.maxHp += 4;
      player.hp = player.maxHp;
      player.atk += 1;
      log(`레벨 업! Lv ${player.plvl} — 최대 HP/공격력 증가, HP 회복!`, "good");
    }
  }

  function pickup() {
    const it = items.find(i => i.x === player.x && i.y === player.y);
    if (!it) return;
    items = items.filter(x => x !== it);
    if (it.type === "potion") {
      player.potions++;
      log("포션을 주웠다. (Q로 사용)", "info");
    } else if (it.type === "gold") {
      player.gold += it.amount;
      log(`골드 +${it.amount}`, "info");
    }
  }

  function usePotion() {
    if (gameOver) return;
    if (player.potions <= 0) { log("포션이 없다.", "bad"); return; }
    player.potions--;
    const heal = 8;
    player.hp = Math.min(player.maxHp, player.hp + heal);
    log(`포션 사용. HP +${heal}`, "good");
    endTurn();
  }

  function descend() {
    depth++;
    bestDepth = Math.max(bestDepth, depth);
    log(`${depth}층으로 내려간다...`, "info");
    const rooms = generateDungeon();
    newLevel(rooms);
    render();
    updateStats();
    saveGame(true);
  }

  function death() {
    gameOver = true;
    bestDepth = Math.max(bestDepth, depth);
    log(`당신은 ${depth}층에서 쓰러졌다. R을 눌러 재시작.`, "bad");
  }

  // ---- 저장 / 불러오기 ----
  // 계정 속성 값은 짧게 유지하려고 키를 줄여서 저장. 층 구조는 저장하지 않고 이어하기 때 새로 만듦
  function makeSave() {
    return {
      v: 1,
      best: bestDepth,
      run: gameOver ? null : {
        d: depth, hp: player.hp, mh: player.maxHp, a: player.atk, g: player.gold,
        p: player.potions, l: player.plvl, x: player.xp, xn: player.xpNext,
      },
    };
  }

  function parseSave(text) {
    try {
      const s = JSON.parse(text);
      return s && s.v === 1 ? s : null;
    } catch { return null; }
  }

  // 로그인 직후 계정 저장본을 먼저 불러오기 전까지는 클라우드에 쓰지 않음 (덮어쓰기 방지)
  let cloudReady = false;
  let cloudTimer = null;

  function saveGame(flushNow = false) {
    store.set(SAVE_KEY, JSON.stringify(makeSave()));
    if (!cloudReady) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(flushCloud, flushNow ? 0 : 2000);
  }

  async function flushCloud(keepalive = false) {
    clearTimeout(cloudTimer);
    cloudTimer = null;
    if (!cloudReady) return;
    try {
      await Account.saveAttr(SAVE_ATTR, store.get(SAVE_KEY), keepalive);
    } catch (e) {
      log(`계정에 저장하지 못했다: ${e.message}`, "bad");
    }
  }

  function startFromSave(s) {
    bestDepth = s?.best || 0;
    if (s?.run) resumeRun(s.run);
    else newGame();
  }

  function resumeRun(r) {
    depth = r.d;
    gameOver = false;
    player = {
      x: 0, y: 0,
      hp: r.hp, maxHp: r.mh,
      atk: r.a,
      gold: r.g,
      potions: r.p,
      plvl: r.l, xp: r.x, xpNext: r.xn,
    };
    logEl.innerHTML = "";
    log(`${depth}층에서 이어서 시작한다.`, "info");
    const rooms = generateDungeon();
    newLevel(rooms);
    render();
    updateStats();
  }

  // 계정 저장본이 있으면 그걸로 이어하고, 없으면 지금(게스트) 진행 상황을 계정에 올림
  async function syncAfterLogin() {
    cloudReady = false;
    try {
      const cloud = parseSave(await Account.loadAttr(SAVE_ATTR));
      if (!Account.loggedIn()) return;
      if (cloud) {
        store.set(SAVE_KEY, JSON.stringify(cloud));
        startFromSave(cloud);
        log("계정에 저장된 진행 상황을 불러왔다.", "good");
      } else {
        await Account.saveAttr(SAVE_ATTR, JSON.stringify(makeSave()));
        log("지금 진행 상황을 계정에 저장했다.", "good");
      }
      cloudReady = true;
    } catch (e) {
      log(`계정 저장 데이터를 불러오지 못했다: ${e.message}`, "bad");
    } finally {
      renderAccount();
    }
  }

  // ---- 적 턴 ----
  function endTurn() {
    // 적 이동/공격
    for (const e of [...enemies]) {
      if (e.hp <= 0) continue;
      if (dist(e, player) === 1) {
        attack(e, player);
        if (gameOver) break;
      } else if (visible[e.y][e.x] && dist(e, player) <= 6) {
        moveToward(e);
      } else if (rnd(3) === 0) {
        // 가끔 배회
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        const [dx, dy] = dirs[rnd(4)];
        stepEnemy(e, dx, dy);
      }
    }
    if (!gameOver) computeFOV();
    render();
    updateStats();
    saveGame();
  }

  function moveToward(e) {
    const dx = Math.sign(player.x - e.x);
    const dy = Math.sign(player.y - e.y);
    // 더 먼 축을 우선, 막히면 다른 축
    if (Math.abs(player.x - e.x) >= Math.abs(player.y - e.y)) {
      if (!stepEnemy(e, dx, 0)) stepEnemy(e, 0, dy);
    } else {
      if (!stepEnemy(e, 0, dy)) stepEnemy(e, dx, 0);
    }
  }

  function stepEnemy(e, dx, dy) {
    const nx = e.x + dx, ny = e.y + dy;
    if (dx === 0 && dy === 0) return false;
    if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return false;
    if (map[ny][nx] === WALL) return false;
    if (nx === player.x && ny === player.y) return false;
    if (enemies.some(o => o !== e && o.x === nx && o.y === ny)) return false;
    e.x = nx; e.y = ny;
    return true;
  }

  // ---- 렌더링 ----
  function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        if (!seen[y][x]) continue;
        const lit = visible[y][x];
        const px = x * TILE, py = y * TILE;
        const t = map[y][x];
        if (t === WALL) {
          ctx.fillStyle = lit ? "#3a3f52" : "#1c1f2b";
          ctx.fillRect(px, py, TILE, TILE);
        } else {
          ctx.fillStyle = lit ? "#12131a" : "#0a0b10";
          ctx.fillRect(px, py, TILE, TILE);
          // 바닥 점 무늬
          ctx.fillStyle = lit ? "#22252f" : "#14161e";
          ctx.fillRect(px + TILE/2 - 1, py + TILE/2 - 1, 2, 2);
          if (t === STAIRS) drawGlyph(">", px, py, lit ? "#ffcf5c" : "#6b5a2a");
        }
      }
    }

    // 아이템
    for (const it of items) {
      if (!visible[it.y][it.x]) continue;
      const px = it.x * TILE, py = it.y * TILE;
      if (it.type === "potion") drawGlyph("!", px, py, "#ff6bd3");
      else drawGlyph("$", px, py, "#ffcf5c");
    }

    // 적
    for (const e of enemies) {
      if (!visible[e.y][e.x]) continue;
      drawGlyph(e.ch, e.x * TILE, e.y * TILE, e.color);
    }

    // 플레이어
    drawGlyph("@", player.x * TILE, player.y * TILE, "#ffffff");
  }

  function drawGlyph(ch, px, py, color) {
    ctx.fillStyle = color;
    ctx.font = `bold ${TILE - 2}px "Courier New", monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ch, px + TILE / 2, py + TILE / 2 + 1);
  }

  // ---- HUD ----
  function updateStats() {
    document.getElementById("depth").textContent = depth;
    document.getElementById("hp").textContent = `${Math.max(0, player.hp)}/${player.maxHp}`;
    document.getElementById("atk").textContent = player.atk;
    document.getElementById("gold").textContent = player.gold;
    document.getElementById("plvl").textContent = player.plvl;
    document.getElementById("xp").textContent = player.xp;
    document.getElementById("xpn").textContent = player.xpNext;
    document.getElementById("best").textContent = bestDepth;
  }

  // ---- 초기화 ----
  function newGame() {
    depth = 1;
    gameOver = false;
    player = {
      x: 0, y: 0,
      hp: 20, maxHp: 20,
      atk: 3,
      gold: 0,
      potions: 1,
      plvl: 1, xp: 0, xpNext: 10,
    };
    logEl.innerHTML = "";
    log("던전에 발을 들였다. 계단(>)을 찾아 더 깊이 내려가라.", "info");
    const rooms = generateDungeon();
    newLevel(rooms);
    render();
    updateStats();
    saveGame();
  }

  // ---- 계정 UI ----
  const accountStatus = document.getElementById("account-status");
  const accountBtn = document.getElementById("account-btn");
  const modal = document.getElementById("login-modal");
  const stepId = document.getElementById("step-id");
  const stepCode = document.getElementById("step-code");
  const idInput = document.getElementById("login-id");
  const codeInput = document.getElementById("login-code");
  const loginMsg = document.getElementById("login-msg");
  let loginKind = "email", loginValue = "", operationId = null;

  function renderAccount() {
    const guest = `게스트 #${Account.deviceId().slice(0, 6)} 로 플레이 중`;
    if (!Account.configured()) {
      accountStatus.textContent = guest;
      accountBtn.textContent = "계정 연결";
      accountBtn.disabled = true;
      accountBtn.title = "Xsolla Login 설정(loginProjectId, clientId)이 필요합니다";
      return;
    }
    accountBtn.disabled = false;
    accountBtn.title = "";
    if (Account.loggedIn()) {
      const c = Account.claims();
      accountStatus.textContent = `${c?.email || c?.phone_number || "계정"} 로그인됨`;
      accountBtn.textContent = "로그아웃";
    } else {
      accountStatus.textContent = guest;
      accountBtn.textContent = "계정 연결";
    }
  }

  function setMsg(text, cls = "") {
    loginMsg.textContent = text;
    loginMsg.className = cls;
  }

  function showStep(step) {
    stepId.hidden = step !== "id";
    stepCode.hidden = step !== "code";
    (step === "id" ? idInput : codeInput).focus();
  }

  function setKind(kind) {
    loginKind = kind;
    for (const b of modal.querySelectorAll(".tabs button")) b.classList.toggle("on", b.dataset.kind === kind);
    const email = kind === "email";
    document.getElementById("login-id-label").textContent = email ? "이메일" : "휴대폰 번호";
    idInput.type = email ? "email" : "tel";
    idInput.autocomplete = email ? "email" : "tel";
    idInput.placeholder = email ? "you@example.com" : "010-1234-5678 또는 +82 10…";
    idInput.value = "";
    setMsg("");
    showStep("id");
  }

  // 010-1234-5678 같은 국내 번호는 국제 형식(+8210…)으로 바꿈
  function normalizePhone(v) {
    const d = v.replace(/[\s()-]/g, "");
    return /^0\d{9,10}$/.test(d) ? "+82" + d.slice(1) : d;
  }

  function openLogin() {
    modal.hidden = false;
    setKind("email");
  }

  function closeLogin() {
    modal.hidden = true;
  }

  async function busy(form, fn) {
    const buttons = form.querySelectorAll("button");
    buttons.forEach(b => (b.disabled = true));
    try { await fn(); } finally { buttons.forEach(b => (b.disabled = false)); }
  }

  stepId.addEventListener("submit", (e) => {
    e.preventDefault();
    loginValue = loginKind === "phone" ? normalizePhone(idInput.value.trim()) : idInput.value.trim();
    if (loginKind === "phone" && !/^\+\d{8,15}$/.test(loginValue)) {
      setMsg("휴대폰 번호 형식을 확인해 주세요.", "err");
      return;
    }
    busy(stepId, async () => {
      setMsg("인증 코드를 보내는 중…");
      try {
        operationId = await Account.requestCode(loginKind, loginValue);
        codeInput.value = "";
        setMsg(`${loginValue}(으)로 인증 코드를 보냈어요.`, "ok");
        showStep("code");
      } catch (err) {
        setMsg(err.message, "err");
      }
    });
  });

  stepCode.addEventListener("submit", (e) => {
    e.preventDefault();
    busy(stepCode, async () => {
      setMsg("확인하는 중…");
      try {
        await Account.confirmCode(loginKind, loginValue, codeInput.value.trim(), operationId);
        closeLogin();
        renderAccount();
        await syncAfterLogin();
      } catch (err) {
        // 코드는 1회용이라 실패하면 새 코드를 받아야 할 수 있음
        setMsg(`${err.message} 코드가 만료됐다면 '다시 입력'으로 새 코드를 받아 주세요.`, "err");
      }
    });
  });

  document.getElementById("login-back").addEventListener("click", () => { setMsg(""); showStep("id"); });
  document.getElementById("login-close").addEventListener("click", closeLogin);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeLogin(); });
  modal.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLogin(); });
  for (const b of modal.querySelectorAll(".tabs button")) b.addEventListener("click", () => setKind(b.dataset.kind));

  accountBtn.addEventListener("click", async () => {
    accountBtn.blur();  // 이후 Space(대기) 키가 버튼을 다시 누르지 않게
    if (!Account.loggedIn()) { openLogin(); return; }
    if (cloudTimer) await flushCloud();
    Account.logout();
    cloudReady = false;
    store.del(SAVE_KEY);
    bestDepth = 0;
    newGame();
    log("로그아웃했다. 게스트로 새로 시작한다.", "info");
    renderAccount();
  });

  // 탭을 닫거나 숨길 때 남은 저장을 바로 보냄
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && cloudTimer) flushCloud(true);
  });

  // ---- 입력 ----
  window.addEventListener("keydown", (e) => {
    if (!modal.hidden || e.target instanceof HTMLInputElement) return;
    const k = e.key.toLowerCase();
    let handled = true;
    switch (k) {
      case "arrowup": case "w":    tryMove(0, -1); break;
      case "arrowdown": case "s":  tryMove(0, 1); break;
      case "arrowleft": case "a":  tryMove(-1, 0); break;
      case "arrowright": case "d": tryMove(1, 0); break;
      case " ":                    wait(); break;
      case "q":                    usePotion(); break;
      case "r":                    newGame(); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  // ---- 시작 ----
  startFromSave(parseSave(store.get(SAVE_KEY)));
  renderAccount();
  if (Account.configured() && Account.loggedIn()) syncAfterLogin();
})();
</script>
</body>
