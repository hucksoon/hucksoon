<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>던전 크롤러 — 랭킹</title>
<style>
  :root {
    --bg: #0d0e14;
    --panel: #16181f;
    --row: #1b1e27;
    --border: #2a2d3a;
    --text: #cdd3de;
    --muted: #8a91a0;
    --accent: #ffcf5c;
    --me: rgba(255, 207, 92, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Courier New", ui-monospace, monospace; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  h1 { font-size: 20px; letter-spacing: 2px; margin: 0; color: var(--accent); text-shadow: 0 0 8px rgba(255, 207, 92, 0.3); }
  a.btn { color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; text-decoration: none; font-size: 13px; }
  @media (hover: hover) { a.btn:hover { border-color: var(--accent); color: var(--accent); } }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .dot.off { background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b; }
  #me, #notice { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
  #me b { color: var(--accent); }
  #notice { color: var(--muted); }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .boards { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 4px; color: var(--accent); }
  .sub { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--row); border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  li.me { background: var(--me); border-color: var(--accent); }
  .rank { font-weight: bold; text-align: center; color: var(--muted); }
  .rank.r1 { color: #ffd54f; } .rank.r2 { color: #cfd8dc; } .rank.r3 { color: #d7a26b; }
  .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who small { color: var(--muted); margin-left: 6px; }
  .val { text-align: right; white-space: nowrap; }
  .item { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 4px; }
  footer { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
  li[data-id] { cursor: pointer; }
  @media (hover: hover) { li[data-id]:hover { border-color: var(--border); background: #222632; } }
  li[data-id]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- 장비 보기 ---- */
  .overlay { position: fixed; inset: 0; background: rgba(5, 6, 10, 0.78); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; z-index: 10; }
  .overlay[hidden] { display: none; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 560px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .modal-head h3 { margin: 0; font-size: 16px; color: var(--accent); word-break: break-all; }
  .modal-head .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .modal button { font: inherit; color: var(--text); background: var(--row); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .modal h4 { margin: 14px 0 6px; font-size: 13px; color: var(--accent); }
  .pstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
  .pstats div { background: var(--row); border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
  .pstats b { display: block; color: var(--text); font-size: 15px; }
  .pitems { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  @media (max-width: 520px) { .pitems { grid-template-columns: 1fr; } }
  .pitem { background: var(--row); border: 1px solid transparent; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.55; }
  .pitem.empty { color: var(--muted); }
  .pitem .slot { color: var(--muted); font-size: 11px; }
  .pitem .nm { font-weight: bold; font-size: 13px; }
  .pitem .rg { color: var(--muted); }
  .pitem .mx .rg { color: #ffd700; }
  .pitem .plus { color: var(--muted); }
  .pitem.ancient { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.35); }
  .pset div { font-size: 12px; color: var(--muted); }
  .pset div.on { color: var(--text); }
  .pnote { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🏆 던전 크롤러 랭킹</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="updated">불러오는 중…</span></div>
    <a class="btn" href="./">게임으로 돌아가기</a>
  </header>

  <div id="notice" hidden></div>
  <div id="me" hidden></div>

  <div class="boards">
    <section>
      <h2>최고 층 랭킹</h2>
      <p class="sub">가장 깊이 내려간 순서 · 같으면 먼저 도달한 사람이 위</p>
      <ol id="board-stage"></ol>
    </section>
    <section>
      <h2>최강 아이템 랭킹</h2>
      <p class="sub">가진 적 있는 최고 아이템 · 등급 → 강화 → 아이템 레벨 순</p>
      <ol id="board-item"></ol>
    </section>
  </div>

  <footer>
    10초마다 자동으로 새로고침해요. 이메일은 가려서 보여주고, 게스트는 게스트 번호로 표시돼요. 이름을 누르면 장비를 볼 수 있어요.<br>
    개발자 계정은 랭킹에서 빠져요.
  </footer>
</main>

<div class="overlay" id="player-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="player-title">
    <div class="modal-head">
      <div><h3 id="player-title"></h3><div class="meta" id="player-meta"></div></div>
      <button type="button" id="player-close">닫기</button>
    </div>
    <div id="player-body"></div>
  </div>
</div>

<script src="ranking-config.js"></script>
<script>
(() => {
  const API = String(window.RANKING_API || "").replace(/\/+$/, "");
  const REFRESH_MS = 10000;
  const RARITY = {
    common: { name: "커먼", color: "#cfd3da" },
    uncommon: { name: "언커먼", color: "#6bd36b" },
    rare: { name: "레어", color: "#5aa9ff" },
    epic: { name: "에픽", color: "#b77bff" },
    legendary: { name: "레전더리", color: "#ff9f2e" },
    set: { name: "세트", color: "#2fd6b5" },
  };
  const $ = (id) => document.getElementById(id);

  // 서버 응답은 textContent로만 넣음 (이름에 HTML이 섞여도 실행되지 않게)
  function el(tag, { dataset, ...props } = {}, ...children) {
    const e = Object.assign(document.createElement(tag), props);
    if (dataset) Object.assign(e.dataset, dataset);
    for (const c of children) if (c != null) e.append(c);
    return e;
  }

  // 게임과 같은 주소라서 게임이 저장한 로그인/게스트 정보를 그대로 씀
  function identityHeaders() {
    try {
      const auth = JSON.parse(localStorage.getItem("rl_auth"));
      if (auth?.access) return auth.exp > Date.now() + 5000 ? { Authorization: `Bearer ${auth.access}` } : "expired";
      const id = localStorage.getItem("rl_device_id");
      return id ? { "X-Guest-Id": id } : null;
    } catch { return null; }
  }

  // PHP 서버(…/api.php)면 ?r=경로&…, Cloudflare Worker면 /api/경로?…
  const url = (path) => {
    if (!/\.php$/.test(API)) return API + path;
    const [route, query] = path.replace(/^\/api\//, "").split("?");
    return `${API}?r=${route}${query ? "&" + query : ""}`;
  };
  async function get(path, headers = {}) {
    const res = await fetch(url(path), { headers });
    if (!res.ok) throw new Error(String(res.status));
    return res.json();
  }

  const medal = (rank) => ["🥇", "🥈", "🥉"][rank - 1] || String(rank);

  function renderBoard(ol, data, myRank, value) {
    if (!data.rows.length) { ol.replaceChildren(el("div", { className: "empty", textContent: "아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!" })); return; }
    ol.replaceChildren(...data.rows.map(r => el("li", {
      className: r.rank === myRank ? "me" : "",
      ...(r.id ? { dataset: { id: r.id }, tabIndex: 0, title: "장비 보기", onclick: () => openPlayer(r.id),
        onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPlayer(r.id); } } } : {}),
    },
      el("span", { className: `rank r${r.rank}`, textContent: medal(r.rank) }),
      el("span", { className: "who" }, r.name, r.guest ? el("small", { textContent: "게스트" }) : null, r.rank === myRank ? el("small", { textContent: "← 나" }) : null),
      value(r),
    )));
  }

  // ---- 장비 보기: 최고 층을 세운 순간의 장비와 능력치 (서버가 시드로 검증하고 계산한 값) ----
  const SLOT_ORDER = [["head", "머리"], ["chest", "가슴"], ["arms", "팔"], ["pants", "바지"], ["boots", "장화"], ["weapon", "무기"]];
  const fmtTime = (ms) => new Date(ms).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });

  function itemCard(it, slotName) {
    if (!it) return el("div", { className: "pitem empty" }, el("div", { className: "slot", textContent: slotName }), "비어 있음");
    const color = (RARITY[it.rarity] || RARITY.common).color;
    const line = (mark, l, colorize) => el("div", { className: l.max ? "mx" : "", style: colorize ? `color:${color}` : "" },
      `${mark} ${l.text}`, l.range ? el("span", { className: "rg", textContent: ` [${l.range}]${l.max ? " ▲" : ""}` }) : null,
      l.plus ? el("span", { className: "plus", textContent: ` (강화 +${l.plus})` }) : null);
    return el("div", { className: `pitem${it.ancient ? " ancient" : ""}` },
      el("div", { className: "slot", textContent: `${it.slotName} · ${it.rarityName} · Lv.${it.lvl}${it.set ? " · " + it.set : ""}` }),
      el("div", { className: "nm", textContent: it.name, style: `color:${color}` }),
      ...it.main.map(l => line("★", l, false)),
      ...it.lines.map(l => line("◆", l, true)));
  }

  async function openPlayer(id) {
    const modal = $("player-modal");
    $("player-title").textContent = "불러오는 중…";
    $("player-meta").textContent = "";
    $("player-body").replaceChildren();
    modal.hidden = false;
    $("player-close").focus();
    let p;
    try { p = await get(`/api/player?id=${encodeURIComponent(id)}`); }
    catch { $("player-title").textContent = "정보를 불러오지 못했어요"; return; }
    $("player-title").textContent = p.name + (p.guest ? " (게스트)" : "");
    $("player-meta").textContent = `최고 ${p.stage}층${p.stageAt ? ` · ${fmtTime(p.stageAt)} 달성` : ""}`;
    const body = [];
    const g = p.gear;
    if (!g) {
      body.push(el("p", { className: "pnote", textContent: "아직 장비 기록이 없어요. 이 기능이 생긴 뒤 최고 층을 새로 세우면(또는 같은 층에 다시 도달하면) 저장돼요." }));
    } else {
      const s = g.stats;
      body.push(el("h4", { textContent: `최고 기록(${g.stage}층) 순간의 능력치 · Lv ${s.level}` }),
        el("div", { className: "pstats" }, ...[
          ["공격력", s.atk], ["방어력", s.def], ["최대 HP", s.maxHp], ["치명타", `${s.crit}% (×${Number(s.critMul).toFixed(1)})`],
          ["흡혈", `${s.lifesteal}%`], ["처치 시 회복", s.killHeal ? `HP +${s.killHeal}` : "-"], ["골드 획득", `+${s.gold}%`], ["경험치 획득", `+${s.xp}%`],
        ].map(([k, v]) => el("div", {}, k, el("b", { textContent: String(v) })))));
      const bySlot = Object.fromEntries((g.items || []).map(it => [it.slot, it]));
      body.push(el("h4", { textContent: "장착 장비" }), el("div", { className: "pitems" }, ...SLOT_ORDER.map(([slot, name]) => itemCard(bySlot[slot], name))));
      for (const set of g.sets || []) {
        body.push(el("h4", { textContent: `${set.name} (${set.count}/6)`, style: `color:${RARITY.set.color}` }),
          el("div", { className: "pset" }, ...set.bonuses.map(b => el("div", { className: b.on ? "on" : "", textContent: `${b.on ? "✔" : "·"} ${b.count}세트: ${b.text}` }))));
      }
      if (g.rejected) body.push(el("p", { className: "pnote", textContent: `확인되지 않은 장비 ${g.rejected}개는 제외했어요.` }));
    }
    if (p.bestItem) body.push(el("h4", { textContent: "가진 적 있는 최강 아이템" }), el("div", { className: "pitems" }, itemCard(p.bestItem, p.bestItem.slotName)));
    body.push(el("p", { className: "pnote", textContent: "장비와 능력치는 서버가 아이템 시드로 다시 만들어 확인한 값이에요. ★ 주 능력치 · ◆ 추가 능력치 · [최소~최대] ▲ 최대치" }));
    $("player-body").replaceChildren(...body);
  }
  $("player-close").addEventListener("click", () => { $("player-modal").hidden = true; });
  $("player-modal").addEventListener("click", (e) => { if (e.target.id === "player-modal") $("player-modal").hidden = true; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("player-modal").hidden = true; });

  const stageValue = (r) => el("span", { className: "val", textContent: `${r.stage}층` });
  function itemValue(r) {
    const rar = RARITY[r.item.rarity] || RARITY.common;
    return el("span", { className: "val" },
      el("span", { className: "item", textContent: r.item.name, style: `color:${rar.color}` }),
      el("small", { textContent: `${rar.name} · +${r.item.enh} · Lv.${r.item.lvl}`, style: "color:var(--muted)" }));
  }

  function renderMe(me) {
    const box = $("me");
    if (me === "expired") { box.hidden = false; box.textContent = "로그인이 만료됐어요. 게임을 한 번 열면 내 순위가 보여요."; return; }
    if (!me) { box.hidden = true; return; }
    box.hidden = false;
    if (me.developer) { box.textContent = "개발자 계정이라 랭킹에서 빠져 있어요."; return; }
    if (!me.stageRank && !me.itemRank) { box.replaceChildren(el("b", { textContent: me.name }), " · 아직 기록이 없어요. 한 층 내려가면 랭킹에 올라가요."); return; }
    box.replaceChildren(
      el("b", { textContent: me.name }),
      ` · 최고 층 ${me.stageRank ? `${me.stageRank}위 (${me.stage}층)` : "-"}`,
      ` · 최강 아이템 ${me.itemRank ? `${me.itemRank}위` : "-"}`,
    );
  }

  let my = { stage: null, item: null };
  async function refresh() {
    if (document.hidden) return;
    try {
      const ids = identityHeaders();
      const [stage, item, me] = await Promise.all([
        get("/api/ranking?type=stage&limit=50"),
        get("/api/ranking?type=item&limit=50"),
        ids && ids !== "expired" ? get("/api/me", ids).catch(() => null) : Promise.resolve(ids),
      ]);
      my = { stage: me?.stageRank ?? null, item: me?.itemRank ?? null };
      renderBoard($("board-stage"), stage, my.stage, stageValue);
      renderBoard($("board-item"), item, my.item, itemValue);
      renderMe(me);
      $("dot").className = "dot";
      $("updated").textContent = `실시간 · ${new Date().toLocaleTimeString("ko-KR")} 기준 · ${stage.total}명`;
    } catch {
      $("dot").className = "dot off";
      $("updated").textContent = "랭킹 서버에 연결하지 못했어요. 잠시 후 다시 시도해요.";
    }
  }

  if (!API) {
    $("dot").className = "dot off";
    $("updated").textContent = "준비 중";
    $("notice").hidden = false;
    $("notice").textContent = "랭킹 서버를 준비하고 있어요. 곧 열릴 예정이에요!";
    for (const id of ["board-stage", "board-item"]) $(id).replaceChildren(el("div", { className: "empty", textContent: "—" }));
    return;
  }
  refresh();
  setInterval(refresh, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
