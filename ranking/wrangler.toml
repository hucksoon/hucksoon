# 던전 크롤러 랭킹 서버 설정 (Cloudflare Workers)
# 배포 방법은 ranking/README.md 를 보세요.
name = "dungeon-ranking"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
LOGIN_PROJECT_ID = "30375188-893b-4b1a-ba1b-c8ba692fa5e3"
ALLOWED_ORIGINS = "https://hucksoon.github.io"

# `npx wrangler d1 create dungeon-ranking` 이 알려주는 database_id 로 바꾸세요
[[d1_databases]]
binding = "DB"
database_name = "dungeon-ranking"
database_id = "REPLACE_WITH_DATABASE_ID"

# 비밀값은 이 파일에 쓰지 말고 `npx wrangler secret put <이름>` 으로 넣으세요 (저장소가 공개라서)
#   HASH_KEY    HMAC 키 (긴 무작위 문자열)
#   DEV_EMAILS  랭킹에서 뺄 개발자 이메일, 쉼표로 구분
#   JWT_SECRET  (선택) Login 프로젝트가 HS256이면 그 비밀 키
